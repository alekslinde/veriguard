# Which licence covers which file. https://reuse.software
#
# Source files also carry an SPDX header; this map covers everything that
# cannot (Markdown, JSON, data, images) and states the defaults. Full licence
# texts are in LICENSES/. The test in __tests__/licensing.test.ts keeps the
# headers, package.json fields and this file in agreement.

version = 1

# The web app, inbound-email worker, scripts, eval harness, tests and repo
# tooling. Copyleft, including over a network (AGPL §13).
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Aleksandr Linde"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The detection engine and MCP server, published to npm. Permissive, so the
# engine can be reused anywhere.
[[annotations]]
path = ["packages/detect/**", "packages/mcp/**"]
SPDX-FileCopyrightText = "2026 Aleksandr Linde"
SPDX-License-Identifier = "Apache-2.0"

# The browser extension, shipped through the Chrome, Edge, Firefox and Apple
# stores. File-level copyleft that is compatible with the App Store.
[[annotations]]
path = "extension/**"
SPDX-FileCopyrightText = "2026 Aleksandr Linde"
SPDX-License-Identifier = "MPL-2.0"

# Written content: the threat-intel sweeps and their source registry, the
# scam-calendar and release docs, and the interface copy.
[[annotations]]
path = ["docs/**", "messages/**"]
SPDX-FileCopyrightText = "2026 Aleksandr Linde"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Generated from the Public Suffix List (https://publicsuffix.org/).
[[annotations]]
path = "packages/detect/src/publicSuffixList.ts"
precedence = "override"
SPDX-FileCopyrightText = "Public Suffix List contributors"
SPDX-License-Identifier = "MPL-2.0"

# App-side, but bundled into the published @veriguard/mcp, so it takes that
# package's licence. The test in __tests__/licensing.test.ts fails if mcp
# starts bundling another lib/ module that is not Apache-2.0.
[[annotations]]
path = "lib/signalTactics.ts"
precedence = "override"
SPDX-FileCopyrightText = "2026 Aleksandr Linde"
SPDX-License-Identifier = "Apache-2.0"

# Tesseract English language data (https://github.com/tesseract-ocr).
[[annotations]]
path = "public/tessdata/**"
precedence = "override"
SPDX-FileCopyrightText = "Tesseract OCR contributors"
SPDX-License-Identifier = "Apache-2.0"

# The Veriguard name and artwork. Not open source; see TRADEMARKS.md.
[[annotations]]
path = [
  "app/apple-icon.png",
  "app/favicon.ico",
  "app/icon.svg",
  "app/icon-dark.svg",
  "public/icon-*.png",
  "extension/icons/**",
  "extension/store/*.png",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Aleksandr Linde"
SPDX-License-Identifier = "LicenseRef-Veriguard-Brand"
