name: Threat-intel source check

# Checks that every source in docs/threat-intel/sources.yml still resolves, and
# refreshes a single "🔗 Threat-intel source check" issue with whatever rotted.
# A clean run closes that issue rather than refreshing it with a green body, so
# an open digest issue always means there is something to act on; the next rot
# reopens the same thread. The check's own liveness is the run and its job
# summary, which are written whether or not anything rotted.
#
# Why this runs at all: the roadmaps in docs/threat-intel/ are the evidence layer
# for hardcoded scores in lib/ — ".monster is +30 because CSC DBS measured >60%
# abuse". When a citation 404s, the justification is gone and only the magic
# number is left. This catches that while the claim is still traceable.
#
# It FLAGS, it does not edit the registry — same philosophy as spam-guard.yml and
# dependabot-triage.yml. Reachability only: whether a source has published
# anything NEW is research work, not a cron job.
#
# One deliberate exception: the `bump-updated` job below. `updated:` is a
# factual claim ("the registry's content, as of this date") that a PR author
# can only get right by remembering to set it, and the PR-time check just
# warns — a comment reflow legitimately shouldn't need a bump, so it can't
# block. That leaves a real gap: a forgotten bump ships silently. Auto-committing
# the date itself carries none of the judgment a reachability edit would (there
# is no "is this source really dead" call to get wrong), so it is automated
# where the reachability checks deliberately are not.
#
# Indicator domains in the registry (scam infrastructure quoted as evidence) are
# never fetched. The script fails the run if one is ever moved into a source
# tier, rather than skipping it quietly.

on:
  schedule:
    # Mondays 21:00 UTC ≈ 07:00 Tuesday Australia/Sydney. An hour after the
    # Dependabot digest, so the week's flagged items land together.
    - cron: "0 21 * * 1"
  pull_request:
    paths:
      - "docs/threat-intel/sources.yml"
      - "scripts/check-sources.mjs"
  push:
    branches: [main]
    paths:
      - "docs/threat-intel/sources.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: source-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # --stale dates the registry from its last commit; a shallow clone
          # would report the checkout date and never flag anything.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # On a PR touching the registry, validate structure only. Firing a hundred
      # requests at government sites on every push is rude and slow, and the
      # thing a PR can actually break is the file's shape.
      - name: Validate registry
        if: github.event_name == 'pull_request'
        run: node scripts/check-sources.mjs --validate

      # The `updated:` header is printed in every report, so a PR that changes
      # the registry and forgets the date ships a false freshness claim. Warns
      # rather than blocks: the date is a judgement about whether the CONTENT
      # changed, and a comment reflow legitimately leaves it alone.
      - name: Check registry header freshness
        if: github.event_name == 'pull_request'
        run: |
          set +e
          node scripts/check-sources.mjs --stale
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "::warning::sources.yml changed but the updated: header was not — set it if the registry content changed."
          elif [ "$code" -gt 1 ]; then
            echo "::error::check-sources --stale failed (exit $code)."
            exit "$code"
          fi

      # Exit 1 (a source rotted) is a maintenance signal, not a broken build, so
      # it passes. Exit 2 means the job itself failed — invalid registry, or the
      # digest could not be published — and must go red, or a silently broken
      # checker looks identical to a clean week forever.
      - name: Check sources and refresh digest
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          node scripts/check-sources.mjs --issue --markdown >> "$GITHUB_STEP_SUMMARY"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "All sources reachable."
          elif [ "$code" -eq 1 ]; then
            echo "::warning::Some threat-intel sources have rotted — see the digest issue."
          else
            echo "::error::check-sources failed (exit $code) — digest may not have been published."
            exit "$code"
          fi

  # Runs only on a push to main that touched the registry (never on a PR — a
  # branch commit here would fight the author's own push). Bumps `updated:`
  # when the CONTENT changed since the previous commit, so a PR that landed
  # without remembering the date still ends up with an accurate one instead of
  # every later report quietly overstating the registry's freshness.
  bump-updated:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # --auto-bump diffs against the pre-push commit. A full checkout
          # (not a shallow depth-2) because a push can carry more than one
          # commit — e.g. a merge commit — and depth 2 would only reach the
          # last commit's immediate parent, not the state before the push. A
          # bot-authored commit must not retrigger this same job, so it's
          # made with [skip ci] rather than relying on depth to dodge it.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: "Bump updated: if content changed"
        env:
          BASE_SHA: ${{ github.event.before }}
        run: node scripts/check-sources.mjs --auto-bump

      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/threat-intel/sources.yml; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/threat-intel/sources.yml
          git commit -m "chore(threat-intel): bump sources.yml updated: date [skip ci]"
          git push
