name: Deploy inbound email worker

# Deploys the Cloudflare Email Worker in workers/inbound-email/. The Next app is
# deployed separately by the app host — this only handles the Worker, and only runs
# when the Worker's own files change, so app-only commits don't redeploy it.
on:
  # Deploys on a worker RELEASE, not on every push to main. The worker is a
  # shippable part with its own version line, so what reaches production is a
  # version somebody cut, the same as every other part. release.yml calls this
  # with the tag it created — a tag made with the default GITHUB_TOKEN starts no
  # workflow, so a tag trigger here would never fire.
  workflow_call:
    inputs:
      ref:
        description: "The tag to deploy, e.g. worker-v0.7.0."
        type: string
        required: true
  # Allow a manual run from the Actions tab (e.g. to re-push the secret).
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to deploy. Blank deploys the default branch."
        type: string
        required: false

# Checkout is all this needs; deployment authenticates with its own credential
# rather than the workflow token. Stated explicitly so the job does not inherit
# a broader default.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/inbound-email
    steps:
      - uses: actions/checkout@v7
        with:
          # The released tag, so a deploy ships the commit its version names
          # rather than whatever main has moved on to since.
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/inbound-email/package-lock.json

      - name: Install worker deps
        run: npm ci

      - name: Unit-test the reply builder
        run: npm test

      # Deploy the Worker FIRST, with no secrets. Setting a secret on a Worker
      # that doesn't exist yet fails (wrangler-action#162), so the worker must
      # exist before the secret step. `wrangler deploy` is idempotent on reruns.
      - name: Deploy worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/inbound-email
          wranglerVersion: "4"

      # Now that the Worker exists, push the shared secret. The `secrets:` input
      # runs `wrangler secret put` for each name; `command: whoami` is a no-op
      # so this step ONLY sets the secret and doesn't redeploy. The value lives
      # only in GitHub repo secrets and the Worker — never in the repo. Must
      # match INBOUND_SECRET set on the Next app (its host's env var).
      - name: Set INBOUND_SECRET
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/inbound-email
          wranglerVersion: "4"
          command: whoami
          secrets: |
            INBOUND_SECRET
        env:
          INBOUND_SECRET: ${{ secrets.INBOUND_SECRET }}
