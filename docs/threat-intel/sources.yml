# Threat-intelligence source registry
#
# The sources the weekly roadmap research draws on, tiered by how much weight a
# claim from each one carries. Built from the citation census of the roadmaps in
# this directory (2026-06-21 through 2026-08-02).
#
# WHY THIS FILE EXISTS
#
# Two reasons, both about trust.
#
# 1. Link rot. Roadmaps justify magic numbers in lib/ — ".monster is +30
#    because CSC DBS measured >60% abuse". When that citation 404s, the evidence
#    for the rule is gone and only the magic number is left. check-sources.mjs
#    catches that while the claim is still traceable.
#
# 2. Source discipline. The census turned up scamwatchhq.com (NOT the real
#    Scamwatch) and scamchecker.app cited beside asic.gov.au with no visible
#    difference in standing. An unconstrained web search will keep finding those.
#    A curated, tiered list is the fix: research reads FROM this file rather than
#    from open search, so a new source is a deliberate reviewed addition.
#
# TIERS
#
#   1  Authoritative. Government, regulator, or national body — mostly AU.
#      A named alert here is sufficient evidence for a high-confidence rule.
#   2  Reputable vendor / press. Real reporting, but commercially interested:
#      a vendor blog has an incentive to make a threat sound novel. Corroborate
#      before it justifies a score on its own.
#   3  Low trust. Cited once, unvetted. Kept — not deleted — so the record of
#      what has already been looked at survives (see README, "Negative results").
#      Never sufficient evidence on its own. Promote only with a reason.
#
# Sources marked `feed:` can be polled for new advisories. Sources marked
# `check: manual` have no feed and no stable index — a human looks, or they
# contribute nothing.
#
# Two flags the checker honours:
#
#   retired: true    Known-gone. Skipped by the checker but kept as a record —
#                    any roadmap claim citing it has lost its evidence and needs
#                    re-sourcing. Requires a note saying what happened.
#   expect: blocked  Edge bot-protection refuses every automated request, so
#                    reachability is unverifiable from CI. Reported as expected
#                    rather than as rot. Use sparingly: each one is a source the
#                    job has stopped genuinely checking.
#
# ⚠️  The `indicators:` block at the bottom is NOT a source list. Those are scam
# domains quoted as evidence in the roadmaps. They must never be fetched. The
# checker asserts they are absent from the source tiers rather than ignoring
# them, so one pasted into the wrong block fails the build.

