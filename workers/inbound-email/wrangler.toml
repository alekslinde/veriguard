name = "veriguard-inbound-email"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# This Worker is bound to a Cloudflare Email Routing address (set up in the
# dashboard — see README.md). It answers with message.reply(), which needs no
# binding: the reply rides the inbound message and can only go back to its
# sender. There is deliberately no send_email binding, since that is the path
# that can send to other addresses.

# INBOUND_WEBHOOK_URL points at the deployed Next app's /api/inbound route.
# INBOUND_SECRET is NOT here — set it as a secret: `wrangler secret put INBOUND_SECRET`
[vars]
INBOUND_WEBHOOK_URL = "https://veriguard.app/api/inbound"
